name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Regenerate missing binary scaffold files
        run: |
          flutter create . --platforms=android --org com.the.disciplined --project-name the_disciplined
          git checkout -- .

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-disciplined-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Write the OTA update manifest
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          NAME="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          printf '{"version": "%s", "build": %s, "apk": "https://github.com/%s/releases/latest/download/app-release.apk", "notes": "Build %s"}\n' "$NAME" "$BUILD" "${{ github.repository }}" "$VERSION" > update.json
          cat update.json

      - name: Publish the APK to a GitHub Release (direct link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            update.json
